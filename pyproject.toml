[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frag"
version = "0.1.0"
description = "Financial RAG over messy filings and macro data: trained hybrid retrieval, an actor–critic answer gate, and an AWS data plane."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.30.6",
  "pydantic==2.8.2",
  "pandas==2.2.2",
  "numpy==2.0.1",
  "scikit-learn==1.5.1",
  "rank-bm25==0.2.2",
  "requests==2.32.3",
  "httpx==0.27.0",
  "python-dotenv==1.0.1",
  "pyyaml==6.0.2",
  "beautifulsoup4==4.12.3",
  "lxml==5.3.0",
  "qdrant-client==1.11.3",
  "sentence-transformers==3.1.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.2",
  "pytest-cov==5.0.0",
  "ruff==0.6.9",
]
eval = [
  "mlflow==3.15.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "C4",  # flake8-comprehensions
]
ignore = []

[tool.ruff.lint.per-file-ignores]
# main.py embeds a static HTML/CSS/JS single-page UI as a string literal;
# its long style and markup lines are not Python and should not be wrapped.
"src/frag/api/main.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
